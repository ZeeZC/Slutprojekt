{% extends "base.html" %}

{% block title %}Redigera kontakt{% endblock %}

{% block content %}
<div class="form-container">
    <h1>✏️ Redigera kontakt</h1>
    <p class="contact-id">ID: {{ contact.contact_id }}</p>
    
    <form method="POST" action="{{ url_for('edit_contact', contact_id=contact.contact_id) }}">
        <div class="form-group">
            <label for="name">Namn *</label>
            <input type="text" id="name" name="name" required value="{{ contact.name }}">
        </div>
        
        <div class="form-group">
            <label for="phone_number">Telefonnummer *</label>
            <input type="tel" id="phone_number" name="phone_number" required value="{{ contact.phone_number }}">
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ contact.email }}">
        </div>
        
        <div class="form-group">
            <label for="address">Adress</label>
            <input type="text" id="address" name="address" value="{{ contact.address }}">
        </div>
        
        <div class="form-group">
            <label for="birth_date">Födelsedatum</label>
            <input type="date" id="birth_date" name="birth_date" value="{{ contact.birth_date }}">
            <small>Format: ÅÅÅÅ-MM-DD</small>
        </div>
        
        <div class="form-group">
            <label for="job_title">Jobbtitel</label>
            <input type="text" id="job_title" name="job_title" value="{{ contact.job_title }}">
        </div>
        
        <div class="form-group">
            <label for="notes">Anteckningar</label>
            <textarea id="notes" name="notes" rows="3">{{ contact.notes }}</textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn-primary">💾 Spara ändringar</button>
            <a href="{{ url_for('index') }}" class="btn-secondary">Avbryt</a>
        </div>
    </form>
</div>
{% endblock %}
